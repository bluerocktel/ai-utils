      - link:
        - /url: https://en.wikipedia.org/wiki/T
      - text: T is the twentieth letter of the Latin alphabet, used in the modern English alphabet, the alphabets of other western European languages and others worldwide. Its name in English is tee, plural tees. It is derived from the Semitic Taw 𐤕 of the Phoenician and Paleo-Hebrew script via the Greek letter τ. In English, it is most commonly used to represent the voiceless alveolar plosive, a sound it also denotes in the International Phonetic Alphabet.
      - link "More at Wikipedia" [ref=f34e18] [cursor=pointer]:
        - /url: https://en.wikipedia.org/wiki/T
