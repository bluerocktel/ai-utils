          - generic [ref=f8e147]:
            - heading "À propos du syndic" [level=2] [ref=f8e148]
            - paragraph [ref=f8e152]: "GLF LOICK FOUCHET est un syndic professionnel installé à Paris 03. Il gère 83 copropriétés immatriculées au registre national, représentant environ 1 956 lots, réparties sur 26 communes. Sa plus ancienne copropriété au registre est immatriculée depuis 2017. Spécialiste des copropriétés moyennes : 80 % de son portefeuille fait entre 11 et 50 lots. Note Google : 2.5/5 (275 avis). Sur les 24 derniers mois, son portefeuille a enregistré 4 copropriétés gagnées et 9 perdues*."
            - generic [ref=f8e153]:
              - generic [ref=f8e154]:
                - generic [ref=f8e155]: "+4"
                - generic [ref=f8e156]: copropriétés gagnées*
              - generic [ref=f8e157]:
                - generic [ref=f8e158]: −9
                - generic [ref=f8e159]: copropriétés perdues*
              - generic [ref=f8e160]:
                - generic [ref=f8e161]: "-5"
                - generic [ref=f8e162]: solde net (24 mois)*
            - paragraph [ref=f8e163]:
              - link "Voir le détail des copropriétés gagnées et perdues par GLF LOICK FOUCHET →" [ref=f8e164] [cursor=pointer]:
                - /url: /changements-de-syndic/syndic/1217
            - generic [ref=f8e165]:
              - generic [ref=f8e166]:
                - generic [ref=f8e167]: 95,4 % de copropriétés conservées sur 12 mois
                - generic [ref=f8e168]: "Moyenne nationale : 94,6 %"
              - paragraph [ref=f8e169]: Part du portefeuille géré il y a douze mois toujours géré aujourd'hui, calculée sur les changements de syndic déclarés au registre national (décisions d'assemblées générales souvent antérieures de plusieurs mois). Hors réorganisations internes d'un même réseau et cessions de portefeuille.
            - paragraph [ref=f8e170]: "* Méthodologie : données issues du registre national d'immatriculation des copropriétés (ANAH / data.gouv.fr), actualisées trimestriellement. Les mouvements comptabilisent uniquement les changements de syndic organiques : les transferts liés aux fusions, acquisitions et réorganisations internes détectés sont exclus. Le registre étant déclaratif, ces chiffres reflètent les déclarations des syndics et peuvent différer de la réalité. Le nombre de copropriétaires ayant lancé une comparaison est mesuré sur la plateforme SyndiCompare : demandes avec le motif « changer de syndic », dédoublonnées par utilisateur, attribuées au syndic en place au moment de la demande (à un trimestre près), hors demandes de test. Période : 24 derniers mois glissants."
